<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai Help Thai v15</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f7;margin:0;color:#1f2937}
.wrap{max-width:720px;margin:auto;padding:18px}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;border:none;border-radius:18px;padding:14px;font-size:16px;font-weight:700}
.active{background:#2563eb;color:white}
.inactive{background:#e5e7eb;color:#374151}
.page{display:none}.show{display:block}
.hero{background:white;border-radius:24px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:14px}
h1{margin:0 0 4px;font-size:24px}
.sub{font-size:14px;color:#6b7280}
label{font-size:16px;font-weight:700;display:block;margin-bottom:8px}
input{width:100%;box-sizing:border-box;padding:16px;border:2px solid #d1d5db;border-radius:16px;font-size:20px}
.inline{display:flex;gap:10px;margin-top:10px}
.add{width:170px;border:none;border-radius:16px;background:#2563eb;color:white;font-size:16px;font-weight:700}
.warn{margin-top:10px;font-size:14px;padding:12px;border-radius:14px}
.red{background:#fee2e2;color:#991b1b}
.yellow{background:#fef3c7;color:#92400e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.card{background:white;border-radius:22px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.card.blue{background:#eef5ff}
.card.green{background:#eef9f0}
.kicker{font-size:13px;color:#6b7280;margin-bottom:6px}
.title{font-size:16px;font-weight:700}
.value{font-size:28px;font-weight:800;margin-top:4px}
.note{font-size:13px;color:#4b5563;margin-top:6px;line-height:1.45}
.section{margin-top:18px}
.section h2{font-size:18px;margin:0 0 10px}
.item{background:white;border-radius:18px;padding:14px;margin-top:10px;border:1px solid #e5e7eb}
.time{font-size:14px;color:#6b7280}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.del,.toggle{border:none;border-radius:12px;padding:8px 12px;font-size:14px}
.del{background:#fee2e2;color:#991b1b}
.toggle{background:#e8efff;color:#1d4ed8}
.clear{width:100%;border:none;border-radius:16px;padding:14px;background:#9ca3af;color:white;font-size:15px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">

<div class="tabs">
<button id="dtab" class="tab active" onclick="showPage('daily')">รายวัน</button>
<button id="mtab" class="tab inactive" onclick="showPage('month')">รายเดือน</button>
</div>

<div id="daily" class="page show">
<div class="hero">
<h1>สิทธิ์ไทยช่วยไทย</h1>
<div class="sub"></div>

<label>ยอดซื้อทั้งหมด (บาท)</label>
<div class="inline">
<input id="amount" inputmode="decimal" placeholder="เช่น 250">
<button class="add" onclick="saveItem()">เพิ่มรายการ</button>
</div>
<div id="inputwarn"></div>
</div>

<div class="grid">
<div class="card blue">
<div class="kicker">รัฐช่วย</div>
<div class="title">60%</div>
<div id="gov" class="value">0.00</div>
<div id="govwarn" class="note"></div>
</div>

<div class="card green">
<div class="kicker">ประชาชนจ่าย</div>
<div class="title">40%</div>
<div id="user" class="value">0.00</div>
<div id="userwarn" class="note"></div>
</div>
</div>

<div class="grid">
<div class="card">
<div class="title">วันนี้ยังซื้อได้</div>
<div id="dailyremain" class="value">333.33</div>
<div id="dailynote" class="note"></div>
</div>

<div class="card">
<div class="title">สิทธิ์รัฐเดือนนี้</div>
<div id="monthremain" class="value">1000.00</div>
<div id="monthnote" class="note"></div>
</div>
</div>

<div class="section">
<h2>รายการวันนี้</h2>
<div id="todaylist"></div>
</div>
</div>

<div id="month" class="page">
<div class="section">
<h2>สรุปรายเดือน</h2>
<div id="monthlist"></div>
<button class="clear" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>
</div>
</div>

</div>

<script>
const DAILY_CAP=200, MONTH_CAP=1000;
function fmt(n){return Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function getItems(){return JSON.parse(localStorage.getItem('thaihelp_v15')||'[]')}
function saveItems(a){localStorage.setItem('thaihelp_v15',JSON.stringify(a))}
function todayKey(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})}
function nowThai(){return new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'medium',timeStyle:'short'})}
function todayUsed(){return getItems().filter(x=>x.day===todayKey()).reduce((a,b)=>a+b.gov,0)}
function monthUsed(){return getItems().reduce((a,b)=>a+b.gov,0)}

function calc(){
let total=parseFloat(amount.value)||0;
inputwarn.innerHTML=''; govwarn.innerHTML=''; userwarn.innerHTML='';
if(total<=0){gov.innerText='0.00';user.innerText='0.00'; renderRemain(); return;}
let tr=Math.max(0,DAILY_CAP-todayUsed());
let mr=Math.max(0,MONTH_CAP-monthUsed());
let gov60=total*0.6;
let govReal=Math.min(gov60,tr,mr);
let userReal=total-govReal;

gov.innerText=fmt(govReal)+' บาท';
user.innerText=fmt(userReal)+' บาท';

let dayTotal = getItems().filter(x=>x.day===todayKey()).reduce((a,b)=>a+b.total,0)+total;
if(dayTotal>333.33){
inputwarn.innerHTML='<div class="warn red">❗ ยอดรวมวันนี้เกิน 333.33 บาท<br>รัฐช่วยได้สูงสุด 200 บาท / วัน</div>';
}
if(gov60>govReal){
govwarn.innerHTML='ยังใช้สิทธิ์รัฐได้อีก '+fmt(tr)+' บาท';
}
if(dayTotal>333.33){
userwarn.innerHTML='จ่ายจริง '+fmt(userReal)+' บาท';
}
renderRemain();
}

function renderRemain(){
let tr=Math.max(0,DAILY_CAP-todayUsed());
let mr=Math.max(0,MONTH_CAP-monthUsed());
dailyremain.innerText=fmt(tr/0.6)+' บาท';
dailynote.innerHTML='ซื้อได้อีก '+fmt(tr/0.6)+' บาท';
monthremain.innerText=fmt(mr)+' บาท';
monthnote.innerHTML='ซื้อได้อีก '+fmt(mr/0.6)+' บาท';
if(mr<=200 && mr>0) monthnote.innerHTML='<div class="warn yellow">⚠️ สิทธิ์เดือนเหลือ '+fmt(mr)+' บาท<br>ซื้อรวมได้อีก '+fmt(mr/0.6)+' บาท</div>';
if(mr<=0) monthnote.innerHTML='<div class="warn red">❗ สิทธิ์เดือนครบแล้ว</div>';
}

function saveItem(){
let total=parseFloat(amount.value);
if(!total||total<=0)return;
let tr=Math.max(0,DAILY_CAP-todayUsed());
let mr=Math.max(0,MONTH_CAP-monthUsed());
let gov=Math.min(total*0.6,tr,mr);
let user=total-gov;
let arr=getItems();
arr.push({day:todayKey(),time:nowThai(),total,gov,user});
saveItems(arr);
amount.value='';
renderAll(); calc();
}

function deleteItem(i){
let arr=getItems(); arr.splice(i,1); saveItems(arr); renderAll(); calc();
}

function renderToday(){
let arr=getItems().filter(x=>x.day===todayKey());
todaylist.innerHTML='';
if(arr.length===0){todaylist.innerHTML='<div class="item">ยังไม่มีรายการ</div>'; return;}
arr.forEach((x,i)=>{
todaylist.innerHTML+=`<div class="item">
<div class="row"><div><div class="time">${x.time}</div><div>ยอดซื้อ ${fmt(x.total)} บาท</div><div>รัฐ ${fmt(x.gov)} : ประชาชน ${fmt(x.user)}</div></div>
<div><button class="del" onclick="deleteItem(${getItems().findIndex(a=>a.time===x.time&&a.total===x.total)})">ลบ</button></div></div></div>`;
});
}

function renderMonth(){
let arr=getItems(); monthlist.innerHTML='';
if(arr.length===0){monthlist.innerHTML='<div class="item">ยังไม่มีรายการ</div>'; return;}
let groups={};
arr.forEach((x,i)=>{if(!groups[x.day])groups[x.day]=[];groups[x.day].push({...x,index:i})});
Object.keys(groups).forEach((d,idx)=>{
let g=groups[d], t=g.reduce((a,b)=>a+b.total,0), gv=g.reduce((a,b)=>a+b.gov,0), u=g.reduce((a,b)=>a+b.user,0);
monthlist.innerHTML+=`<div class="item">
<div class="row"><div><strong>${d}</strong><div class="time">ยอดซื้อรวม ${fmt(t)} • รัฐ ${fmt(gv)} • ประชาชน ${fmt(u)}</div></div>
<button class="toggle" onclick="toggleDay(${idx})">ดู ${g.length} รายการ</button></div>
<div id="day${idx}" style="display:none;margin-top:10px">
${g.map(x=>`<div style="border-top:1px solid #eee;padding-top:8px;margin-top:8px">
<div class="time">${x.time}</div>
<div>ยอดซื้อ ${fmt(x.total)} • รัฐ ${fmt(x.gov)} • ประชาชน ${fmt(x.user)}</div>
<button class="del" onclick="deleteItem(${x.index})">ลบ</button>
</div>`).join('')}
</div></div>`;
});
}
function toggleDay(i){let e=document.getElementById('day'+i); e.style.display=e.style.display==='none'?'block':'none';}
function clearAll(){if(confirm('ล้างข้อมูลทั้งหมด?')){localStorage.removeItem('thaihelp_v15'); renderAll(); calc();}}
function renderAll(){renderToday(); renderMonth(); renderRemain();}
function showPage(p){
daily.classList.remove('show'); month.classList.remove('show');
document.getElementById(p).classList.add('show');
dtab.className='tab inactive'; mtab.className='tab inactive';
if(p==='daily') dtab.className='tab active'; else mtab.className='tab active';
}
amount.addEventListener('input',calc);
renderAll(); calc();
</script>
</body>
</html>
